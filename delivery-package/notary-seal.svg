<?xml version="1.0" encoding="UTF-8"?>
<!-- 委托公证人专用章 · 红色圆形 · 可直接嵌入 PTAHDAO APP -->
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="sealGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>
    <filter id="sealRough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2"/>
    </filter>
  </defs>
  <!-- 外圈 -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#sealGrad)" stroke-width="3.5" filter="url(#sealRough)"/>
  <!-- 内圈 -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="url(#sealGrad)" stroke-width="1.5"/>
  <!-- 上半文字：中国委托公证人 -->
  <path id="topArc" d="M 25 100 A 75 75 0 0 1 175 100" fill="none"/>
  <text fill="#991b1b" font-size="14" font-weight="700" font-family="serif" letter-spacing="3">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">中国委托公证人</textPath>
  </text>
  <!-- 下半文字：香港 -->
  <path id="botArc" d="M 35 105 A 65 65 0 0 0 165 105" fill="none"/>
  <text fill="#991b1b" font-size="11" font-weight="600" font-family="serif" letter-spacing="4">
    <textPath href="#botArc" startOffset="50%" text-anchor="middle">香 港 · CAO-HK-D0468</textPath>
  </text>
  <!-- 中心五角星 -->
  <g transform="translate(100 85)">
    <polygon points="0,-22 6,-7 22,-7 9,3 14,19 0,9 -14,19 -9,3 -22,-7 -6,-7" 
             fill="url(#sealGrad)" stroke="#7f1d1d" stroke-width="0.8"/>
  </g>
  <!-- 公证人姓名 -->
  <text x="100" y="138" text-anchor="middle" fill="#991b1b" font-size="13" font-weight="700" font-family="serif">鄧達明</text>
  <!-- 执业编号 -->
  <text x="100" y="155" text-anchor="middle" fill="#b91c1c" font-size="9" font-family="monospace">CAO-HK-D0468</text>
</svg>
